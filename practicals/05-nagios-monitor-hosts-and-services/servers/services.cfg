# ---- Services applied to the whole hostgroup ----
define service {
    use                 generic-service
    hostgroup_name      lab-nodes
    service_description PING
    check_command       check_ping!100.0,20%!500.0,60%
}

define service {
    use                 generic-service
    hostgroup_name      lab-nodes
    service_description SSH
    check_command       check_ssh
}

# HTTP only where a web server runs
define service {
    use                 generic-service
    host_name           node1
    service_description HTTP
    check_command       check_http
}
