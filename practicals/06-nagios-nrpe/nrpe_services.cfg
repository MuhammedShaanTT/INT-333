# /usr/local/nagios/etc/servers/nrpe_services.cfg  (Nagios server)
define command {
    command_name    check_nrpe
    command_line    $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

define service {
    use                 generic-service
    host_name           node1
    service_description Current Users (NRPE)
    check_command       check_nrpe!check_users
}

define service {
    use                 generic-service
    host_name           node1
    service_description CPU Load (NRPE)
    check_command       check_nrpe!check_load
}

define service {
    use                 generic-service
    host_name           node1
    service_description Root Disk (NRPE)
    check_command       check_nrpe!check_root_disk
}

define service {
    use                 generic-service
    host_name           node1
    service_description Total Processes (NRPE)
    check_command       check_nrpe!check_total_procs
}
